services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviews-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://reviews_user:change_me@db:5432/reviews_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: reviews-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviews_db}
      POSTGRES_USER: ${POSTGRES_USER:-reviews_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

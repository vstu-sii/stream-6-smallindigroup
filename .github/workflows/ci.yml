name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t reviews-analyzer:ci .

  evals-fast:
    name: Evals (fast slice)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r evals/requirements.txt

      - name: Lint evals
        run: |
          python -m ruff check evals
          python -m ruff format --check evals

      - name: Evaluator self-tests and blocking gates
        run: python -m pytest evals -m fast -v

      - name: Metrics report
        if: always()
        run: |
          python -m evals.run --slice fast --out evals-fast.json --md evals-fast.md
          cat evals-fast.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-fast
          path: |
            evals-fast.json
            evals-fast.md

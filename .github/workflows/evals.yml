name: Evals

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  evals-fast:
    name: Evals (fast slice)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/evals/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tests/evals/requirements.txt

      - name: Lint evals
        run: |
          python -m ruff check tests
          python -m ruff format --check tests

      # Порог: метрика ниже tests/evals/thresholds.json → gates — PR красный.
      - name: Evaluator self-tests and blocking gates
        run: python -m pytest tests/evals -m fast -v

      - name: Metrics report
        if: always()
        run: |
          python -m tests.evals.run --slice fast --out evals-fast.json --md evals-fast.md
          cat evals-fast.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-fast
          path: |
            evals-fast.json
            evals-fast.md

  evals-full:
    name: Evals (full test split + batches)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Отчёт, не блок: цели PRD показываются в summary и артефакте.
      - name: Full evals report
        run: |
          python -m tests.evals.run --slice full --out evals-full.json --md evals-full.md
          cat evals-full.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evals-full
          path: |
            evals-full.json
            evals-full.md

name: Evals nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  evals-full:
    name: Evals (full test split + batches)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Отчёт, не блок: цели PRD показываются в summary и артефакте.
      - name: Full evals report
        run: |
          python -m evals.run --slice full --out evals-full.json --md evals-full.md
          cat evals-full.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: evals-full
          path: |
            evals-full.json
            evals-full.md
